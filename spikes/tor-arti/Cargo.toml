[package]
name = "possums-tor-arti-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false

# Deliberately independent from the production package and lockfile.
[workspace]

[features]
default = []
arti = ["dep:arti-client", "dep:tor-hsservice", "dep:tor-hscrypto", "dep:tor-keymgr", "dep:tor-cell", "dep:tor-proto", "dep:tor-rtcompat", "dep:fs-mistrust", "dep:tor-llcrypto", "dep:tempfile"]

[dependencies]
futures = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

# Released APIs, not a protocol fork. keymgr() requires the experimental CLI-extra feature.
arti-client = { version = "=0.47.0", optional = true, default-features = false, features = ["tokio", "rustls", "onion-service-service", "onion-service-cli-extra", "memquota", "vanguards", "static-sqlite"] }
tor-hsservice = { version = "=0.47.0", optional = true }
tor-hscrypto = { version = "=0.47.0", optional = true }
tor-keymgr = { version = "=0.47.0", optional = true }
tor-cell = { version = "=0.47.0", optional = true }
tor-proto = { version = "=0.47.0", optional = true }
tor-rtcompat = { version = "=0.47.0", optional = true, features = ["tokio", "rustls"] }
fs-mistrust = { version = "0.16", optional = true }
tor-llcrypto = { version = "=0.47.0", optional = true }
tempfile = { version = "3", optional = true }
