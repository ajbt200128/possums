cvm-version: 0.14.12
cpus: 2
memory: 8192
networks:
  inference:
    egress: allowlist
    allow:
      - inference.tinfoil.sh
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh
containers:
  - name: gateway
    image: ghcr.io/ajbt200128/possums-free@sha256:20d04b3b1ba79f669bac66345f6a80fdaa88365e835718004459b7f3bda3e709
    restart: "no"
    env:
      - HOME: "/tmp"
      - POSSUMS_BIND: "0.0.0.0:8080"
      - POSSUMS_GATEWAY_ATTESTATION_SOCKET: "/tinfoil/attestation.sock"
      - POSSUMS_GATEWAY_REPOSITORY: "ajbt200128/possums@free-v0.0.1"
      - POSSUMS_TINFOIL_HOST: "inference.tinfoil.sh"
      - POSSUMS_TINFOIL_REPOSITORY: "tinfoilsh/confidential-model-router"
      - OTEL_SDK_DISABLED: "true"
    networks: [inference]
    attestation: true
    pids_limit: 256
    read_only: true
    tmpfs:
      /tmp: "size=64m,mode=1777"
    secrets:
      - POSSUMS_FREE_API_KEYS_JSON
      - TINFOIL_API_KEY
shim:
  upstream-port: 8080
  paths:
    - /*
