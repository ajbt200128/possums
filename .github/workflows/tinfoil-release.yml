# Existing same-repository diagnostic release path; no production dispatch.
name: Tinfoil Release - NONPRODUCTION ten-minute Tor diagnostic
run-name: NONPRODUCTION v0.0.53-debug-tor-health.2
on:
  workflow_dispatch:
concurrency:
  group: diagnostic-v0.0.53-debug-tor-health.2
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  diagnostic-measure-and-release:
    if: github.repository == 'ajbt200128/possums' && github.ref == 'refs/tags/v0.0.53-debug-tor-health.2' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful exact debug image build and release-only delta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run view 39150178658 --repo ajbt200128/possums --json headSha,conclusion,event,headBranch,attempt > build-public.json
          gh run download 39150178658 --repo ajbt200128/possums --name debug-tor-health-0aebc70c33dc0a66c8799b32df7b0229124bf9fa-39150178658-1 --dir build-artifact
          python3 - <<'PY'
          import json, pathlib, subprocess
          source = '0aebc70c33dc0a66c8799b32df7b0229124bf9fa'
          digest = 'sha256:a660c5c4461c00c76bfeac224eebd04287b5812890f4e5d0ba0f8bdb9ecea33a'
          def git(*args):
              return subprocess.check_output(['git', *args])
          build = json.loads(pathlib.Path('build-public.json').read_text())
          assert build == {'headSha': source, 'conclusion': 'success', 'event': 'workflow_dispatch', 'headBranch': 'v0.0.53-debug-tor-health.2-build', 'attempt': 1}
          identity = json.loads(pathlib.Path('build-artifact/diagnostic-identity.json').read_text())
          assert identity == {'source': source, 'digest': digest, 'run': '39150178658', 'attempt': '1', 'production_qualified': False}
          assert git('rev-parse', 'HEAD^').decode().strip() == source
          assert set(git('diff', '--name-only', source, 'HEAD').decode().splitlines()) == {'tinfoil-config.yml', '.github/workflows/tinfoil-release.yml', 'docs/tor-ten-minute-debug-verification.md'}
          original = git('show', source + ':tinfoil-config.yml')
          old = b'sha256:33eb3605cde1f84473ab521b8b587230447f64564dddc9fb7019edc77ece07a7'
          assert original.count(old) == 1
          assert pathlib.Path('tinfoil-config.yml').read_bytes() == original.replace(old, digest.encode())
          assert b'start_period: 600s' in original and b'OTEL_SDK_DISABLED: "true"' in original
          print('DEBUG_SOURCE_BUILD_AND_CONFIG_GATE_PASS')
          PY
      - name: Measure exact debug image and publish signed diagnostic identity
        uses: tinfoilsh/measure-image-action@f2ec2fdf4510459730f0a5158c5817f5361e9461 # v0.13.2
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mark-as-latest: "false"
