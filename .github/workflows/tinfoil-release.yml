# Legacy entry point now uses the same exact-main reproducible release path.
name: Tinfoil Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-release:
    if: github.repository == 'ajbt200128/possums' && github.ref == 'refs/heads/main' && vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the gated reproducible release path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run publish-image.yml --ref main
