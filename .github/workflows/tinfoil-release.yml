# Isolated operator-requested rebuild control; never merge into main.
name: Tinfoil Release
run-name: NONPRODUCTION exact v43 fresh A-B rebuild
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-v43-fresh-rebuild
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'ajbt200128/possums' && github.ref == 'refs/heads/test/v43-fresh-rebuild' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        build: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: c22a55f0f710b8343422a9b03776161e0dba67d5
          persist-credentials: false
      - name: Require exact unchanged v43 source
        run: |
          test "$(git rev-parse HEAD)" = c22a55f0f710b8343422a9b03776161e0dba67d5
          test -z "$(git status --porcelain)"
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
          use-gha-cache: true
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
      - name: Prewarm external build dependencies only
        run: nix build .#release-build-deps --no-update-lock-file --out-link result-release-deps --print-build-logs
      - name: Require fresh application and image outputs
        run: python3 scripts/check-release-cache.py
      - name: Build exact v43 OCI archive without substitution or remote builders
        run: nix build .#gateway-image --no-update-lock-file --option substitute false --option builders "" --print-build-logs
      - name: Record public OCI manifest digest
        run: |
          cp -L result gateway-image.tar.gz
          nix shell --inputs-from . nixpkgs#skopeo nixpkgs#jq --command sh -c \
            'skopeo inspect docker-archive:gateway-image.tar.gz | jq -r .Digest > digest'
          grep -Eq '^sha256:[0-9a-f]{64}$' digest
          git diff --exit-code HEAD -- .
      - name: Build isolated synthetic health fixture
        if: matrix.build == 'a'
        run: nix build .#gateway-smoke-image --no-update-lock-file --out-link "$RUNNER_TEMP/fixture-image" --print-build-logs
      - name: Qualify exact fresh A archive offline
        if: matrix.build == 'a'
        run: python3 tests/image_health.py gateway-image.tar.gz "$RUNNER_TEMP/fixture-image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v43-digest-${{ github.run_id }}-${{ matrix.build }}
          path: digest
          if-no-files-found: error
          retention-days: 1
      - if: matrix.build == 'a'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v43-image-${{ github.run_id }}
          path: gateway-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: v43-digest-${{ github.run_id }}-*
          path: artifacts
      - name: Require independent agreement and compare original v43 digest
        env:
          RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          values = [Path(f"artifacts/v43-digest-{os.environ['RUN']}-{side}/digest").read_text().strip() for side in ('a', 'b')]
          valid = all(re.fullmatch(r'sha256:[0-9a-f]{64}', value) for value in values)
          if not valid or values[0] != values[1]:
              print(json.dumps({'code': 'V43_REBUILD_AGREEMENT_FAILED', 'passed': False}))
              raise SystemExit(1)
          print(json.dumps({'code': 'V43_REBUILD_AGREED', 'passed': True,
              'image': values[0], 'matches_original': values[0] == 'sha256:f05f08b739f067d6f5acdadbe3d3ced9cfab1514c1f0fe1e42d16d60c6a06d25',
              'published': False, 'deployed': False}))
          PY
