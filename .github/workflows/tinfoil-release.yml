# Existing same-repository diagnostic release path; no production dispatch.
name: Tinfoil Release - NONPRODUCTION reachable Arti diagnostics
run-name: NONPRODUCTION v0.0.53-debug-tor-health.4
on:
  workflow_dispatch:
concurrency:
  group: diagnostic-v0.0.53-debug-tor-health.4
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  diagnostic-measure-and-release:
    if: github.repository == 'ajbt200128/possums' && github.ref == 'refs/tags/v0.0.53-debug-tor-health.4' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact successful image build and release-only configuration delta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run view 39168974498 --repo ajbt200128/possums --json headSha,conclusion,event,headBranch,attempt > build-public.json
          gh run download 39168974498 --repo ajbt200128/possums --name debug-tor-health-aba880c786ac4b3cf7939b2167f706cd52ddf8fa-39168974498-1 --dir build-artifact
          python3 - <<'PY'
          import json, pathlib, subprocess
          source = 'aba880c786ac4b3cf7939b2167f706cd52ddf8fa'
          digest = 'sha256:e51654c571fffd9a43aa480185d2b40f148777d0147ce9025f8584f405381df5'
          def git(*args):
              return subprocess.check_output(['git', *args])
          build = json.loads(pathlib.Path('build-public.json').read_text())
          assert build == {'headSha': source, 'conclusion': 'success', 'event': 'workflow_dispatch', 'headBranch': 'v0.0.53-debug-tor-health.4-build', 'attempt': 1}
          identity = json.loads(pathlib.Path('build-artifact/diagnostic-identity.json').read_text())
          assert identity == {'source': source, 'digest': digest, 'run': '39168974498', 'attempt': '1', 'production_qualified': False}
          assert git('rev-parse', 'HEAD^').decode().strip() == source
          assert set(git('diff', '--name-only', source, 'HEAD').decode().splitlines()) == {'tinfoil-config.yml', '.github/workflows/tinfoil-release.yml', 'docs/tor-arti-background-debug-verification.md'}
          original = git('show', source + ':tinfoil-config.yml')
          old = b'sha256:8667405e5469618437259700a06c63bc73d540ac07d5ef5a65e7a325bf715491'
          off = b'OTEL_SDK_DISABLED: "true"'
          assert original.count(old) == original.count(off) == 1
          expected = original.replace(old, digest.encode()).replace(off, b'OTEL_SDK_DISABLED: "false"')
          assert pathlib.Path('tinfoil-config.yml').read_bytes() == expected
          assert b'start_period: 600s' in original
          print('DEBUG_SOURCE_BUILD_CONFIG_AND_EXPORT_SWITCH_GATE_PASS')
          PY
      - name: Measure exact debug image and publish signed diagnostic identity
        uses: tinfoilsh/measure-image-action@f2ec2fdf4510459730f0a5158c5817f5361e9461 # v0.13.2
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mark-as-latest: "false"
