name: Publish reproducible free gateway image

on:
  workflow_dispatch:

concurrency:
  group: publish-free-gateway-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful checks on the exact source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in check.yml check-free.yml; do
            run_id=$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" \
              --branch "$GITHUB_REF_NAME" --limit 20 --json databaseId \
              --jq '.[0].databaseId // empty')
            if test -z "$run_id"; then
              echo "::error::Run $workflow on this exact commit before publishing an image"
              exit 1
            fi
            gh run watch "$run_id" --exit-status
          done

  build:
    strategy:
      matrix:
        build: [a, b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
          use-gha-cache: true
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
      - name: Prewarm external build dependencies only
        run: nix build .#free-release-build-deps --out-link result-release-deps --print-build-logs
      - name: Require fresh application and image outputs
        run: python3 scripts/check-release-cache.py --free
      - name: Build OCI archive without substitution or remote builders
        run: nix build .#free-gateway-image --option substitute false --option builders "" --print-build-logs
      - name: Record OCI manifest digest
        run: |
          cp -L result free-gateway-image.tar.gz
          nix shell --inputs-from . nixpkgs#skopeo nixpkgs#jq --command sh -c \
            'skopeo inspect docker-archive:free-gateway-image.tar.gz | jq -r .Digest > digest'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: free-image-digest-${{ matrix.build }}
          path: digest
          retention-days: 1
      - if: matrix.build == 'a'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: free-gateway-image
          path: free-gateway-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    needs: [source-checks, build]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: true
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
        with:
          diagnostic-endpoint: ""
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: free-image-digest-*
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: free-gateway-image
          path: artifacts/free-gateway-image
      - name: Require independent builds to agree
        run: |
          digest_a=$(cat artifacts/free-image-digest-a/digest)
          digest_b=$(cat artifacts/free-image-digest-b/digest)
          test "$digest_a" = "$digest_b"
          echo "IMAGE_DIGEST=$digest_a" >> "$GITHUB_ENV"
      - name: Publish the exact verified archive
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/ajbt200128/possums-free
        run: |
          printf '%s' "$GHCR_TOKEN" | nix shell --inputs-from . nixpkgs#skopeo --command \
            skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          nix shell --inputs-from . nixpkgs#skopeo --command skopeo copy --preserve-digests \
            docker-archive:artifacts/free-gateway-image/free-gateway-image.tar.gz \
            "docker://$IMAGE:${GITHUB_SHA}"
          registry_digest=$(nix shell --inputs-from . nixpkgs#skopeo nixpkgs#jq --command sh -c \
            "skopeo inspect 'docker://$IMAGE:$GITHUB_SHA' | jq -r .Digest")
          test "$registry_digest" = "$IMAGE_DIGEST"
          echo "IMAGE_REFERENCE=$IMAGE@$registry_digest" >> "$GITHUB_ENV"
      - name: Open free config-only digest update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("deploy/free/tinfoil-config.yml")
          text = path.read_text()
          pattern = r"(?m)^    image: ghcr\.io/ajbt200128/possums-free@sha256:[0-9a-f]{64}$"
          replacement = f"    image: {os.environ['IMAGE_REFERENCE']}"
          updated, count = re.subn(pattern, replacement, text)
          if count != 1:
              raise SystemExit(f"expected one free gateway image reference, found {count}")
          path.write_text(updated)
          PY
          branch="automation/free-image-${GITHUB_RUN_ID}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "$branch"
          git add deploy/free/tinfoil-config.yml
          git commit -m "release: pin free gateway image ${IMAGE_DIGEST}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "release: pin free gateway image ${IMAGE_DIGEST}" \
            --body "Pins the independently reproduced and published free gateway image to \`${IMAGE_REFERENCE}\`."
          gh workflow run check.yml --ref "$branch"
