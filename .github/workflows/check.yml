name: check
run-name: check.yml:${{ inputs.release_request || github.sha }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_request:
        description: Public release commit used to correlate explicit tag checks
        type: string
        required: false
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  flake:
    runs-on: ubuntu-latest
    outputs:
      production-artifact: ${{ steps.production.outputs.artifact-id }}
      fixture-artifact: ${{ steps.fixture.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
          use-gha-cache: true
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
      - name: Prefer upstream before GitHub cache lookups
        run: python3 scripts/ci-cache-order.py
      - run: python3 -m unittest discover -s tests -p 'test_release*.py'
      - name: Check pinned Linux release-cache graph partition without building outputs
        run: RELEASE_CACHE_GRAPH_CHECK=1 python3 -m unittest discover -s tests -p 'test_release_cache.py'
      - name: Test image-health qualification guards offline
        run: python3 -m unittest discover -s tests -p 'test_image_health.py'
      - name: Test Tor-image qualification projections offline
        run: python3 -m unittest discover -s tests -p 'test_image_tor.py'
      - name: Test standalone serving verifier without public traffic
        env:
          GOTOOLCHAIN: local
        run: |
          nix build --no-write-lock-file .#attestation-go --out-link "$RUNNER_TEMP/possums-serving-go"
          "$RUNNER_TEMP/possums-serving-go/bin/go" -C attestation-helper test -mod=readonly \
            ../scripts/verify-serving/main.go ../scripts/verify-serving/main_test.go
      - run: nix flake check --no-write-lock-file --print-build-logs
      # Reuse this runner's realized dependency artifacts, not a best-effort cache
      # round trip. Downstream jobs consume this producer's immutable artifact IDs.
      - name: Build CI images and key-free Tor probe once
        run: |
          nix build --no-write-lock-file .#gateway-image .#gateway-smoke-image .#tor-image-probe --no-link --print-build-logs
          nix build --no-write-lock-file .#gateway-image --out-link "$RUNNER_TEMP/production-image"
          nix build --no-write-lock-file .#gateway-smoke-image --out-link "$RUNNER_TEMP/fixture-image"
          nix build --no-write-lock-file .#tor-image-probe --out-link "$RUNNER_TEMP/tor-probe"
          mkdir -p "$RUNNER_TEMP/ci-production" "$RUNNER_TEMP/ci-fixture"
          cp -L "$RUNNER_TEMP/production-image" "$RUNNER_TEMP/ci-production/production-image.tar.gz"
          cp -L "$RUNNER_TEMP/fixture-image" "$RUNNER_TEMP/ci-fixture/fixture-image.tar.gz"
          cp -L "$RUNNER_TEMP/tor-probe/bin/tor-image-probe" "$RUNNER_TEMP/ci-fixture/tor-image-probe"
      - id: production
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-production-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-production/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - id: fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-fixture-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-fixture/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  image:
    needs: flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.flake.outputs.production-artifact }}
          path: ${{ runner.temp }}/ci-production
          merge-multiple: true
      - name: Load the exact CI production archive and require Linux amd64
        run: |
          docker load < "$RUNNER_TEMP/ci-production/production-image.tar.gz"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' possums-gateway:phase0)" = linux/amd64

  image-startup:
    needs: flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.flake.outputs.production-artifact }}
          path: ${{ runner.temp }}/ci-production
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.flake.outputs.fixture-artifact }}
          path: ${{ runner.temp }}/ci-fixture
          merge-multiple: true
      - name: Prepare the key-free probe executable
        run: chmod +x "$RUNNER_TEMP/ci-fixture/tor-image-probe"
      - name: Qualify real NSS and SDK construction in the production rootfs offline
        run: python3 tests/image_tor.py "$RUNNER_TEMP/ci-production/production-image.tar.gz" "$RUNNER_TEMP/ci-fixture/tor-image-probe"
      - name: Qualify packaged production health probe against isolated synthetic fixture
        run: python3 tests/image_health.py "$RUNNER_TEMP/ci-production/production-image.tar.gz" "$RUNNER_TEMP/ci-fixture/fixture-image.tar.gz"
      - name: Smoke test read-only startup with a runtime account secret
        run: |
          docker load < "$RUNNER_TEMP/ci-fixture/fixture-image.tar.gz"
          accounts='[{"id":"startup-canary","credential_sha256":"g80hPkaKL7rbUpYj1pvTaDr7jxOh8KvDFn00a94wNxk","demo_microunits":1000}]'
          container=$(docker run -d --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 \
            -e POSSUMS_ACCOUNTS_JSON="$accounts" possums-gateway-smoke:phase0)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            test "$(docker inspect -f '{{.State.Running}}' "$container")" = true && \
              docker logs "$container" 2>&1 | grep -q '^http://127.0.0.1:' && break
            sleep 0.25
          done
          test "$(docker inspect -f '{{.State.Running}}' "$container")" = true
          docker logs "$container" 2>&1 | grep -q '^http://127.0.0.1:'
          if docker logs "$container" 2>&1 | grep -q 'startup-canary'; then
            exit 1
          fi
          test "$(docker logs "$container" 2>&1 | wc -l)" -eq 1
