name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - run: nix flake check --print-build-logs
      - run: nix build .#gateway-image --print-build-logs
