name: check
run-name: check.yml:${{ inputs.release_request || github.sha }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_request:
        description: Public release commit used to correlate explicit tag checks
        type: string
        required: false
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
          use-gha-cache: true
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
      - run: python3 -m unittest discover -s tests -p 'test_release*.py'
      - name: Test standalone serving verifier without public traffic
        env:
          GOTOOLCHAIN: local
        run: |
          nix build .#attestation-go --out-link "$RUNNER_TEMP/possums-serving-go"
          "$RUNNER_TEMP/possums-serving-go/bin/go" -C attestation-helper test -mod=readonly \
            ../scripts/verify-serving/main.go ../scripts/verify-serving/main_test.go
      - run: nix flake check --print-build-logs
      - name: Seed API smoke and image outputs
        run: nix build .#api-smoke-fixture .#gateway-image .#gateway-smoke-image --no-link --print-build-logs

  image:
    needs: flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
          use-gha-cache: true
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
      - run: nix build .#gateway-image --print-build-logs

  image-startup:
    needs: flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
          use-gha-cache: true
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
      - name: Build isolated synthetic API smoke image
        run: nix build .#gateway-smoke-image --print-build-logs
      - name: Smoke test read-only startup with a runtime account secret
        run: |
          docker load < result
          accounts='[{"id":"startup-canary","credential_sha256":"g80hPkaKL7rbUpYj1pvTaDr7jxOh8KvDFn00a94wNxk","demo_microunits":1000}]'
          container=$(docker run -d --network none --read-only --tmpfs /tmp:rw,size=64m,mode=1777 \
            -e POSSUMS_ACCOUNTS_JSON="$accounts" possums-gateway-smoke:phase0)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            test "$(docker inspect -f '{{.State.Running}}' "$container")" = true && \
              docker logs "$container" 2>&1 | grep -q '^http://127.0.0.1:' && break
            sleep 0.25
          done
          test "$(docker inspect -f '{{.State.Running}}' "$container")" = true
          docker logs "$container" 2>&1 | grep -q '^http://127.0.0.1:'
          if docker logs "$container" 2>&1 | grep -q 'startup-canary'; then
            exit 1
          fi
          test "$(docker logs "$container" 2>&1 | wc -l)" -eq 1
