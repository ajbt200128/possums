name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - run: nix flake check --print-build-logs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: nix develop -c bash -lc 'npm run test:browser'

  image:
    strategy:
      matrix:
        build: [a, b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - run: nix build .#gateway-image --print-build-logs
      - name: Record OCI manifest digest
        run: nix shell nixpkgs#skopeo nixpkgs#jq --command sh -c 'skopeo inspect docker-archive:result | jq -r .Digest > digest'
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.build }}
          path: digest

  compare-images:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
      - name: Require independent OCI builds to agree
        run: test "$(cat digests/image-digest-a/digest)" = "$(cat digests/image-digest-b/digest)"
