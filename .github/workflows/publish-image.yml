name: Publish reproducible gateway image
run-name: Image source ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_dispatch:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-gateway-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-checks:
    if: github.repository == 'ajbt200128/possums' && vars.RELEASE_AUTOMATION_ENABLED == 'true' && (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.source.outputs.source }}
    steps:
      # Trusted workflow implementation, NOT workflow_run.head_sha or PR artifacts.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        name: Validate originating event, exact checks and current main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
        run: python3 scripts/release.py source

  build:
    needs: source-checks
    strategy:
      matrix:
        build: [a, b]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.source-checks.outputs.source }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
          use-gha-cache: true
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
      - name: Prewarm external build dependencies only
        run: nix build .#release-build-deps --out-link result-release-deps --print-build-logs
      - name: Require fresh application and image outputs
        run: python3 scripts/check-release-cache.py
      - name: Build OCI archive without substitution or remote builders
        run: nix build .#gateway-image --option substitute false --option builders "" --print-build-logs
      - name: Record OCI manifest digest
        run: |
          cp -L result gateway-image.tar.gz
          nix shell --inputs-from . nixpkgs#skopeo nixpkgs#jq --command sh -c \
            'skopeo inspect docker-archive:gateway-image.tar.gz | jq -r .Digest > digest'
      - name: Build isolated synthetic fixture for fresh A image qualification
        if: matrix.build == 'a'
        run: nix build .#gateway-smoke-image --out-link "$RUNNER_TEMP/fixture-image" --print-build-logs
      - name: Qualify exact fresh A archive before publication
        if: matrix.build == 'a'
        run: python3 tests/image_health.py gateway-image.tar.gz "$RUNNER_TEMP/fixture-image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.source-checks.outputs.source }}-${{ matrix.build }}
          path: digest
          retention-days: 1
      - if: matrix.build == 'a'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.source-checks.outputs.source }}
          path: gateway-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    timeout-minutes: 180
    needs: [source-checks, build]
    runs-on: ubuntu-latest
    env:
      SOURCE: ${{ needs.source-checks.outputs.source }}
      RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
    permissions:
      actions: write
      contents: write
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.source-checks.outputs.source }}
          fetch-depth: 0
          persist-credentials: true
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
        with:
          diagnostic-endpoint: ""
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.source-checks.outputs.source }}-*
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gateway-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.source-checks.outputs.source }}
          path: artifacts/gateway-image
      - id: digest
        name: Require independent builds to agree
        run: |
          digest_a=$(cat "artifacts/image-digest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE}-a/digest")
          digest_b=$(cat "artifacts/image-digest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE}-b/digest")
          test "$digest_a" = "$digest_b"
          [[ "$digest_a" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$digest_a" >> "$GITHUB_OUTPUT"
      - name: Publish the exact verified archive
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.image }}
          IMAGE: ghcr.io/ajbt200128/possums-gateway
        run: |
          printf '%s' "$GHCR_TOKEN" | nix shell --inputs-from . nixpkgs#skopeo --command \
            skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          nix shell --inputs-from . nixpkgs#skopeo --command skopeo copy --preserve-digests \
            docker-archive:artifacts/gateway-image/gateway-image.tar.gz \
            "docker://$IMAGE:${SOURCE}"
          registry_digest=$(nix shell --inputs-from . nixpkgs#skopeo nixpkgs#jq --command sh -c \
            "skopeo inspect 'docker://$IMAGE:$SOURCE' | jq -r .Digest")
          test "$registry_digest" = "$IMAGE_DIGEST"
      - id: release
        name: Bind release-only commit, check exact tag, publish and verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.image }}
        run: python3 scripts/release.py prepare "$SOURCE" "$IMAGE_DIGEST"
      - name: Dispatch protected production candidate only when separately enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCTION_DEPLOYMENT_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.image }}
          RELEASE: ${{ steps.release.outputs.release }}
          TAG: ${{ steps.release.outputs.tag }}
        run: python3 scripts/release.py dispatch-deploy "$SOURCE" "$RELEASE" "$TAG" "$IMAGE_DIGEST"
