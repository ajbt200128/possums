name: check-free

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
        with:
          diagnostic-endpoint: ""
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
          use-gha-cache: true
          source-revision: 5a7f052c8f0c6511bbef3570eeed4d39242171ef
      - run: python3 -m unittest discover -s tests -p 'test_release_cache.py'
      - run: nix build .#free-gateway-image --print-build-logs
