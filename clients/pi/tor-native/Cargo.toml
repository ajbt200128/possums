[package]
name = "possums-tor-native"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

# Independent, unwired qualification candidate; no parent workspace changes.
[workspace]

[dependencies]
tor-socksproto = { version = "=0.47.0", default-features = false, features = ["client-handshake"] }
tokio = { version = "=1.53.3", features = ["rt", "macros", "net", "io-util", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.190"
