cvm-version: 0.14.12
cpus: 2
memory: 8192
networks:
  inference:
    egress: allowlist
    allow:
      - inference.tinfoil.sh
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh
      - api.honeycomb.io
containers:
  - name: gateway
    image: ghcr.io/ajbt200128/possums-gateway@sha256:6027863e9e269c8389684e40cab5245eac7110179aaa583f514eecde272f741c
    env:
      - HOME: "/tmp"
      - POSSUMS_BIND: "0.0.0.0:8080"
      - POSSUMS_GATEWAY_ATTESTATION_SOCKET: "/tinfoil/attestation.sock"
      - POSSUMS_GATEWAY_REPOSITORY: "ajbt200128/possums"
      - POSSUMS_TINFOIL_HOST: "inference.tinfoil.sh"
      - POSSUMS_TINFOIL_REPOSITORY: "tinfoilsh/confidential-model-router"
      - OTEL_EXPORTER_OTLP_ENDPOINT: "https://api.honeycomb.io"
      - OTEL_SERVICE_NAME: "possums-gateway"
    networks: [inference]
    attestation: true
    pids_limit: 256
    read_only: true
    tmpfs:
      /tmp: "size=64m,mode=1777"
    secrets:
      - POSSUMS_ACCOUNTS_JSON
      - TINFOIL_API_KEY
      - OTEL_EXPORTER_OTLP_HEADERS
shim:
  upstream-port: 8080
  paths:
    - /*
