cvm-version: 0.14.12
cpus: 2
memory: 8192
attested-keys:
  - id: possums-tor-endorsement-v1
    key: ed25519
    uid: 65532
    gid: 65532
networks:
  inference:
    egress: open
containers:
  - name: gateway
    image: ghcr.io/ajbt200128/possums-gateway@sha256:9d34c323414b3f3361814a7f0daa7bff293ebe8fc40edc20301e12ff789f4433
    env:
      - HOME: "/tmp"
      - POSSUMS_BIND: "0.0.0.0:8080"
      - POSSUMS_TOR_ENABLED: "false"
      - POSSUMS_GATEWAY_ATTESTATION_SOCKET: "/tinfoil/attestation.sock"
      - POSSUMS_GATEWAY_REPOSITORY: "ajbt200128/possums"
      - POSSUMS_TINFOIL_HOST: "inference.tinfoil.sh"
      - POSSUMS_TINFOIL_REPOSITORY: "tinfoilsh/confidential-model-router"
      - OTEL_EXPORTER_OTLP_ENDPOINT: "https://api.honeycomb.io"
      - OTEL_SERVICE_NAME: "possums-gateway"
      - OTEL_SDK_DISABLED: "true"
    networks: [inference]
    attestation: true
    keys: [possums-tor-endorsement-v1]
    healthcheck:
      test: ["CMD", "/bin/possums", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    pids_limit: 256
    read_only: true
    tmpfs:
      /tmp: "size=512m,mode=1777"
    secrets:
      - POSSUMS_ACCOUNTS_JSON
      - TINFOIL_API_KEY
      - OTEL_EXPORTER_OTLP_HEADERS
      - POSSUMS_TOR_IDENTITY_NATIVE_KEY
      - POSSUMS_TOR_EXPECTED_ONION
shim:
  upstream-port: 8080
  paths:
    - /*
