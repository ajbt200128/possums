cvm-version: 0.14.12
cpus: 2
memory: 8192
networks:
  inference:
    egress: allowlist
    allow:
      - inference.tinfoil.sh
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh
containers:
  - name: gateway
    image: ghcr.io/ajbt200128/possums-gateway@sha256:45395fad53d7df0390da1cbed2a2cf46202a5a566fbc45694ba434dbcc41a22b
    env:
      - HOME: "/tmp"
      - POSSUMS_BIND: "0.0.0.0:8080"
      - POSSUMS_GATEWAY_ATTESTATION_SOCKET: "/tinfoil/attestation.sock"
      - POSSUMS_GATEWAY_REPOSITORY: "ajbt200128/possums"
      - POSSUMS_TINFOIL_HOST: "inference.tinfoil.sh"
      - POSSUMS_TINFOIL_REPOSITORY: "tinfoilsh/confidential-model-router"
    networks: [inference]
    attestation: true
    pids_limit: 256
    read_only: true
    tmpfs:
      /tmp: "size=64m,mode=1777"
    secrets:
      - POSSUMS_ACCOUNTS_JSON
      - TINFOIL_API_KEY
shim:
  upstream-port: 8080
  paths:
    - /*
