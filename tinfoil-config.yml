cvm-version: 0.14.12
cpus: 2
memory: 8192
networks:
  inference:
    egress: allowlist
    allow:
      - inference.tinfoil.sh
      - github-proxy.tinfoil.sh
      - kds-proxy.tinfoil.sh
      - api.honeycomb.io
containers:
  - name: gateway
    image: ghcr.io/ajbt200128/possums-gateway@sha256:8c1d2fbbd7a316aff914af1ec6625d1827b284425b8d7e822c9bc8a974550e0c
    env:
      - HOME: "/tmp"
      - POSSUMS_BIND: "0.0.0.0:8080"
      - POSSUMS_GATEWAY_ATTESTATION_SOCKET: "/tinfoil/attestation.sock"
      - POSSUMS_GATEWAY_REPOSITORY: "ajbt200128/possums"
      - POSSUMS_TINFOIL_HOST: "inference.tinfoil.sh"
      - POSSUMS_TINFOIL_REPOSITORY: "tinfoilsh/confidential-model-router"
      - OTEL_EXPORTER_OTLP_ENDPOINT: "https://api.honeycomb.io"
      - OTEL_SERVICE_NAME: "possums-gateway"
    networks: [inference]
    attestation: true
    healthcheck:
      test: ["CMD", "/bin/possums", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    pids_limit: 256
    read_only: true
    tmpfs:
      /tmp: "size=64m,mode=1777"
    secrets:
      - POSSUMS_ACCOUNTS_JSON
      - TINFOIL_API_KEY
      - OTEL_EXPORTER_OTLP_HEADERS
shim:
  upstream-port: 8080
  paths:
    - /*
