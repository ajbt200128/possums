[package]
name = "possums"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[features]
default = []
# Experimental debug image only; never enable in production releases.
debug-tor-readiness = ["tor"]
tor = ["dep:arti-client", "dep:tor-hsservice", "dep:tor-hscrypto", "dep:tor-keymgr", "dep:tor-cell", "dep:tor-proto", "dep:tor-rtcompat", "dep:tokio-util", "dep:fs-mistrust", "dep:tor-llcrypto", "dep:tempfile", "dep:spki", "dep:ssh-key", "dep:zeroize"]

[dependencies]
# Same released APIs/features as the isolated Arti spike; never enabled by default.
arti-client = { version = "=0.47.0", optional = true, default-features = false, features = ["tokio", "rustls", "onion-service-service", "onion-service-cli-extra", "memquota", "vanguards", "static-sqlite", "ephemeral-keystore"] }
tor-hsservice = { version = "=0.47.0", optional = true }
tor-hscrypto = { version = "=0.47.0", optional = true }
tor-keymgr = { version = "=0.47.0", optional = true }
tor-cell = { version = "=0.47.0", optional = true }
tor-proto = { version = "=0.47.0", optional = true }
tor-rtcompat = { version = "=0.47.0", optional = true, features = ["tokio", "rustls"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
# Offline native KeyMgr fixtures (same optional dependencies as the spike).
fs-mistrust = { version = "0.16", optional = true }
tor-llcrypto = { version = "=0.47.0", optional = true }
tempfile = { version = "3", optional = true }
spki = { version = "0.7", optional = true }
ssh-key = { package = "ssh-key-fork-arti", version = "=0.6.7", optional = true, features = ["std"] }
zeroize = { version = "=1.9.0", optional = true }
async-trait = "0.1"
axum = { version = "0.8", features = ["http1"] }
base64 = "0.22"
cpu-time = "=1.0.0"
# Numeric /proc/self/statm only on Linux; never smaps paths or addresses.
memory-stats = { version = "=1.2.0", features = ["always_use_statm"] }
futures-util = "0.3"
http = "1.3"
http-body = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
rand = "0.9"
ring = "=0.17.14"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
# Exact upstream revision and local patch provenance: vendor/tinfoil/POSSUMS.md.
tinfoil = { path = "vendor/tinfoil" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "set-header", "timeout"] }

http-body-util = "0.1"
opentelemetry = { version = "=0.29.1", default-features = false, features = ["metrics"] }
opentelemetry-http = { version = "=0.29.0", default-features = false }
opentelemetry-proto = { version = "=0.29.0", default-features = false, features = ["gen-tonic-messages", "metrics", "logs"] }
opentelemetry_sdk = { version = "=0.29.0", default-features = false, features = ["metrics"] }
prost = "=0.13.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
# Already locked; Linux-only independent nonblocking FIFO presentation.
libc = "=0.2.189"

[dev-dependencies]
# Historical stock-exporter qualification only; runtime uses its supported proto transform.
opentelemetry-http = { version = "=0.29.0", default-features = false, features = ["hyper"] }
opentelemetry-otlp = { version = "=0.29.0", default-features = false, features = ["http-proto", "hyper-client"] }
tokio = { version = "1", features = ["test-util"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
