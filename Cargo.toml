[package]
name = "possums"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
ammonia = "4.1"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "http1"] }
base64 = "0.22"
http = "1.3"
http-body = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
tinfoil = { git = "https://github.com/tinfoilsh/tinfoil-rs", rev = "34157e497a747c191852d52af39cfbdb8dbd9eb7" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "set-header", "timeout"] }

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["test-util"] }
